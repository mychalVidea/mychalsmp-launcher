[package]
name = "mychalsmp-launcher"
version = "1.7.6"
description = "MYCHAL SMP Official Launcher (SMPClient) — Pure Rust & Tauri v2"
authors = ["mychalVidea"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mychalsmp_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart", "gzip"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
hmac = "0.12"
rand = "0.8"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
regex = "1.10"
once_cell = "1.19"
walkdir = "2.5"
sysinfo = "0.30"
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.8", features = ["v3", "v4"] }
chrono = "0.4"
dirs = "5.0"
open = "5.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_Foundation"
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

