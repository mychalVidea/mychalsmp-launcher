appId: xyz.mychalsmp.launcher
productName: MYCHAL SMP Launcher
copyright: Copyright © 2026 mychalVidea
directories:
  output: dist
  buildResources: build
files:
  - "src/**/*"
  - "node_modules/**/*"
  - "package.json"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.ico
  publisherName: "mychalVidea"
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: MYCHAL SMP Launcher
  uninstallDisplayName: MYCHAL SMP Launcher

linux:
  maintainer: "mychalVidea <admin@mychalsmp.xyz>"
  target:
    - target: tar.gz
      arch:
        - x64
  category: Game
  icon: build/icon.png
  desktop:
    Name: MYCHAL SMP Launcher
    Comment: Oficiální launcher Minecraft sítě MYCHAL SMP
    Categories: Game;ActionGame;AdventureGame;
