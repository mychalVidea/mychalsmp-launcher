name: Build and Auto-Release Launcher

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe, .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows Packages
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (.tar.gz, .deb, .rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Linux Packages
        run: npx electron-builder --linux deb rpm tar.gz --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare Clean Release Files
        run: |
          cd release-assets
          # Odstranit nepotřebné podpůrné soubory
          rm -f *.blockmap latest*.yml
          
          # Vytvořit neměnné univerzální soubory pro přímé stahování z webu
          SETUP_EXE=$(ls *Setup*.exe 2>/dev/null | head -n 1)
          if [ -n "$SETUP_EXE" ]; then
            cp "$SETUP_EXE" "mychalsmp-launcher-setup.exe"
          fi
          
          LINUX_TAR=$(ls *.tar.gz 2>/dev/null | head -n 1)
          if [ -n "$LINUX_TAR" ]; then
            cp "$LINUX_TAR" "mychalsmp-launcher.tar.gz"
          fi
          
          echo "=== Seznam souborů k vydání ==="
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: "MYCHAL SMP Launcher v${{ steps.pkg_version.outputs.version }}"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.tar.gz
            release-assets/*.deb
            release-assets/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
