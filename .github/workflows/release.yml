name: Build and Auto-Release Launcher (Tauri v2)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Vlastní verze k vydání (např. 1.0.1 nebo 1.4.6, prázdné = verze z package.json)'
        required: false
        default: ''

concurrency:
  group: release-pipeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux
          - platform: windows-latest
            os: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux System Dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node Dependencies
        run: npm install

      - name: Apply Custom Version If Provided
        if: "${{ github.event.inputs.custom_version != '' || startsWith(github.ref, 'refs/tags/v') }}"
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            VERSION="${{ github.event.inputs.custom_version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json'));
            pkg.version = '$VERSION';
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
            const tauriConf = JSON.parse(fs.readFileSync('./src-tauri/tauri.conf.json'));
            tauriConf.version = '$VERSION';
            fs.writeFileSync('./src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2) + '\n');
            let cargo = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version\s*=\s*\"[^\"]+\"/m, 'version = \"' + '$VERSION' + '\"');
            fs.writeFileSync('./src-tauri/Cargo.toml', cargo);
          "

      - name: Build Tauri Application
        run: npm run tauri:build

      - name: Package Linux Artifacts (.deb, .rpm, .AppImage, .tar.gz)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p artifacts/linux

          # 1. Collect .deb bundle (Ubuntu / Debian / Mint / Pop!_OS)
          DEB_FILE=$(find src-tauri/target/release/bundle/deb -name "*.deb" -type f 2>/dev/null | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" artifacts/linux/
            cp "$DEB_FILE" artifacts/linux/mychalsmp-launcher.deb
          fi

          # 2. Collect .rpm bundle (Fedora / Nobara / RHEL / openSUSE)
          RPM_FILE=$(find src-tauri/target/release/bundle/rpm -name "*.rpm" -type f 2>/dev/null | head -n 1)
          if [ -n "$RPM_FILE" ]; then
            cp "$RPM_FILE" artifacts/linux/
            cp "$RPM_FILE" artifacts/linux/mychalsmp-launcher.rpm
          fi

          # 3. Collect .AppImage bundle (Univerzální pro CachyOS / Arch / Fedora / Ubuntu)
          APPIMAGE_FILE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" -type f 2>/dev/null | head -n 1)
          if [ -n "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" artifacts/linux/
            cp "$APPIMAGE_FILE" artifacts/linux/mychalsmp-launcher.AppImage
          fi

          # 4. Create .tar.gz archive for install.sh (CachyOS / Arch / Fedora / Ubuntu)
          BIN_PATH=""
          if [ -f "src-tauri/target/release/SMPClient" ]; then
            BIN_PATH="src-tauri/target/release/SMPClient"
          elif [ -f "src-tauri/target/release/mychalsmp-launcher" ]; then
            BIN_PATH="src-tauri/target/release/mychalsmp-launcher"
          fi

          if [ -n "$BIN_PATH" ]; then
            mkdir -p /tmp/tar-build/mychalsmp-launcher
            cp "$BIN_PATH" /tmp/tar-build/mychalsmp-launcher/mychalsmp-launcher
            chmod +x /tmp/tar-build/mychalsmp-launcher/mychalsmp-launcher
            ln -sf mychalsmp-launcher /tmp/tar-build/mychalsmp-launcher/SMPClient
            [ -d "assets" ] && cp -r assets /tmp/tar-build/mychalsmp-launcher/ 2>/dev/null || true
            mkdir -p /tmp/tar-build/mychalsmp-launcher/resources
            cp src/renderer/assets/logo.png /tmp/tar-build/mychalsmp-launcher/resources/ 2>/dev/null || true
            cp src/renderer/assets/server-icon.png /tmp/tar-build/mychalsmp-launcher/resources/ 2>/dev/null || true

            VERSION=$(node -p "require('./package.json').version")
            GZIP=-9 tar -czvf "artifacts/linux/mychalsmp-launcher-${VERSION}.tar.gz" -C /tmp/tar-build mychalsmp-launcher
            cp "artifacts/linux/mychalsmp-launcher-${VERSION}.tar.gz" "artifacts/linux/mychalsmp-launcher.tar.gz"
            rm -rf /tmp/tar-build
          fi

      - name: Package Windows Artifacts (.exe / NSIS)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir -p artifacts/windows
          SETUP_EXE=$(find src-tauri/target/release/bundle/nsis -name "*setup*.exe" -o -name "*.exe" 2>/dev/null | head -n 1)
          if [ -n "$SETUP_EXE" ]; then
            cp "$SETUP_EXE" artifacts/windows/
            cp "$SETUP_EXE" artifacts/windows/mychalsmp-launcher-setup.exe
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: artifacts/${{ matrix.os }}/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Get Version for Release
        id: pkg_version
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            VERSION="${{ github.event.inputs.custom_version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: artifacts-*
          merge-multiple: true

      - name: Inspect Release Assets
        run: |
          echo "=== Seznam souborů k vydání ==="
          ls -lh release-assets/

      - name: Generate Changelog from Commit Message
        id: changelog
        shell: bash
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG=$(git log -1 --pretty=format:"%B" 2>/dev/null || true)
          fi
          if [[ "$COMMIT_MSG" =~ ^Release\ v[0-9] ]] || [[ "$COMMIT_MSG" =~ ^v[0-9] ]]; then
            PREV_MSG=$(git log -2 --pretty=format:"%s" 2>/dev/null | tail -n +2 | head -n 1 || true)
            if [ -n "$PREV_MSG" ] && [[ ! "$PREV_MSG" =~ ^Release\ v ]]; then
              COMMIT_MSG="$PREV_MSG"
            fi
          fi
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Aktualizace launcheru v${{ steps.pkg_version.outputs.version }}"
          fi
          echo "Changelog pro release: $COMMIT_MSG"
          printf "%s\n" "$COMMIT_MSG" > release_notes.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: "MYCHAL SMP Launcher v${{ steps.pkg_version.outputs.version }}"
          body_path: release_notes.txt
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: |
            release-assets/*.exe
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.AppImage
            release-assets/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Old Releases (Keep only latest)
        run: |
          CURRENT_TAG="v${{ steps.pkg_version.outputs.version }}"
          echo "Nejnovější vydaná verze: $CURRENT_TAG"
          echo "Kontroluji a mažu starší releases..."

          ALL_TAGS=$(gh release list --limit 100 --json tagName | jq -r '.[].tagName' 2>/dev/null || true)

          for tag in $ALL_TAGS; do
            if [ "$tag" != "$CURRENT_TAG" ] && [ -n "$tag" ]; then
              echo "Odstraňuji starý release $tag..."
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || gh release delete "$tag" --yes 2>/dev/null || true
            fi
          done

          echo "Ponechán pouze 1 nejnovější release: $CURRENT_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
